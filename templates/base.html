<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<style>
:root{--accent: {{ accent }};}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f6f3ef;color:#1d1a17;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;padding:20px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;background:#eee}
h1{font-size:1.3rem;text-align:center;margin:.2rem 0 1rem}
p.sub{text-align:center;margin:.2rem 0 1rem;color:#5a534b}
label{display:block;margin:.9rem 0 .3rem;font-weight:600}
input[type=text],input[type=tel],input[type=password]{width:100%;padding:.8rem;border:1px solid #d8d2ca;border-radius:10px;font-size:1.1rem}
.btn{display:block;width:100%;padding:.9rem;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:1rem}
.btn.alt{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5}
.err{background:#fdecea;color:#8a1c14;padding:.7rem;border-radius:10px;margin:.8rem 0}
.ok{background:#e8f5e9;color:#1b5e20;padding:.7rem;border-radius:10px;margin:.8rem 0}
.warn{background:#fff4e0;color:#7a4b00;padding:.7rem;border-radius:10px;margin:.8rem 0}
.consent{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;font-size:.92rem;line-height:1.7;font-weight:400}
.consent input{margin-top:.4rem;width:1.2rem;height:1.2rem;flex:none}
.small{font-size:.85rem;color:#6b645b;text-align:center;margin-top:1rem}
</style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div></body>
</html>
